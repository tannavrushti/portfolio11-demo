<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#0a0f1f] via-[#0f172a] to-black">

    <div class="w-full max-w-md p-8 rounded-2xl backdrop-blur-lg bg-white/10 border border-white/20 ">

        <h2 class="text-3xl font-bold text-center text-white mb-6">
            Create Account
        </h2>

        <form class="space-y-5">

            <!-- Name -->
            <div>
                <label class="text-gray-300 text-sm">Full Name</label>
                <input type="text" class="w-full mt-1 px-4 py-2 rounded-lg border border-gray-500 text-black"
                    placeholder="Enter your name">
            </div>

            <!-- Email -->
            <div>
                <label class="text-gray-300 text-sm">Email</label>
                <input type="email" class="w-full mt-1 px-4 py-2 rounded-lg border border-grey-500 text-black"
                    placeholder="Enter your email">
            </div>

            <!-- Password -->
            <div>
                <label class="text-gray-300 text-sm">Password</label>
                <input type="password" class="w-full mt-1 px-4 py-2 rounded-lg border border-gray-500 text-black"
                    placeholder="Create password">
            </div>

            <!-- Button -->
            <button Onclick="signup()"
                class="w-full py-2 rounded-lg bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold">
                Sign Up
            </button>

        </form>

        <p class="text-center text-gray-400 mt-6 text-sm">
            Already have an account?
            <a href="login.html" class="text-purple-400 hover:text-blue-400 transition">Login</a>
        </p>

    </div>

</body>

</html>

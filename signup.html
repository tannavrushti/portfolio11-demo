<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> Signup</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#0a0f1f] via-[#0f172a] to-black">

    <div class="w-full max-w-md p-8 rounded-2xl backdrop-blur-lg bg-white/10 border border-white/20 ">

        <h2 class="text-3xl font-bold text-center text-white mb-6">
            Create Account
        </h2>

        <form id="signupForm" class="space-y-5">

            <!-- Name -->
            <div>
                <label class="text-gray-300 text-sm">Full Name</label>
                <input type="text" id="name" class="w-full mt-1 px-4 py-2 rounded-lg border border-gray-500 text-black"
                    placeholder="Enter your name" required>
            </div>

            <!-- Email -->
            <div>
                <label class="text-gray-300 text-sm">Email</label>
                <input type="email" id="email"
                    class="w-full mt-1 px-4 py-2 rounded-lg border border-grey-500 text-black"
                    placeholder="Enter your email" required>
            </div>

            <!-- Password -->
            <div>
                <label class="text-gray-300 text-sm">Password</label>
                <input type="password" id="password"
                    class="w-full mt-1 px-4 py-2 rounded-lg border border-gray-500 text-black"
                    placeholder="Create password" required>
            </div>

            <!-- Button -->
            <button type="submit"
                class="w-full py-2 rounded-lg bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold">
                Sign Up
            </button>
            <p class="text-center text-gray-400 mt-6 text-sm">
                Already have an account?
                <a href="login.html" class="text-purple-400 hover:text-blue-400 transition">Login</a>
            </p>

        </form>

    </div>
    <script src="port.js"></script>

</body>

</html>

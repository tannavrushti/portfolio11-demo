<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> Login</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center  to-black">

    <div class="w-full max-w-md p-8 rounded-2xl backdrop-blur-lg border border-black bg-black-700 ">

        <h2 class="text-3xl font-bold text-center text-black mb-6">
            Login
        </h2>

        <form class="space-y-5">

            <!-- Email -->
            <div>
                <label class="text-gray-500 text-sm">Email</label>
                <input type="email" id="Email"
                    class="w-full mt-1 px-4 py-2 rounded-lg border border-gray-500 text-black"
                    placeholder="Enter your email" required>
            </div>

            <!-- Password -->
            <div>
                <label class="text-gray-500 text-sm">Password</label>
                <input type="password" id="Password"
                    class="w-full mt-1 px-4 py-2 rounded-lg border border-gray-500 text-black"
                    placeholder="Enter your password" required>
            </div>

            <!-- Button -->
            <button onclick="login()" type="submit"
                class="w-full py-2 rounded-lg bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold ">
                Login
            </button>

        </form>

        <p class="text-center text-gray-400 mt-6 text-sm">
            Don't have an account?
            <a href="signup.html" class="text-blue-400 hover:text-purple-400 transition">Sign Up</a>
        </p>

    </div>

</body>

</html>
